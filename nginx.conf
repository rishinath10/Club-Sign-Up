server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # This app is never to be indexed - it collects student names. Sent as a
  # header as well as a meta tag so it also covers non-HTML responses, and
  # "always" so it is still sent on error responses.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  # Client-side routes (/primary, /secondary, /teacher) have no matching file
  # on disk - fall back to index.html and let App.tsx read the path.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
